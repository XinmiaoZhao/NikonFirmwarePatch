name: Host checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      firmware_smoke:
        description: 'Run Windows prebuilt firmware checks with hash-pinned public inputs'
        type: boolean
        default: false
      toolkit_sha256:
        description: 'SHA-256 from the release toolkit checksum file (required for firmware_smoke)'
        type: string

      regression_version:
        description: 'Full-selection firmware version from the reference build'
        type: string
      regression_sha256:
        description: 'Full-selection firmware SHA-256 from the reference build'
        type: string

permissions:
  contents: read

jobs:
  paths:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tests/test_compiled_paths.py

  windows-toolkit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.firmware_smoke
    needs: paths
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify the exact release toolkit and obtain official input
        env:
          REGRESSION_VERSION: ${{ inputs.regression_version }}
          REGRESSION_SHA256: ${{ inputs.regression_sha256 }}
          TOOLKIT_SHA256: ${{ inputs.toolkit_sha256 }}
        shell: python
        run: |
          import hashlib, json, os, re, sys, urllib.request, zipfile
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          sys.path.insert(0, str(root))
          from tools.check_release import check_release
          work = Path(os.environ['RUNNER_TEMP']) / 'nikon-smoke'
          work.mkdir(exist_ok=False)
          tag = 'v0.4.0-rc.2'
          prefix = 'NikonFirmwarePatch-' + tag
          filename = prefix + '-toolkit.zip'
          url = 'https://github.com/XinmiaoZhao/NikonFirmwarePatch/releases/download/' + tag + '/' + filename
          expected_zip = os.environ['TOOLKIT_SHA256']
          if not re.fullmatch(r'[0-9a-f]{64}', expected_zip):
              raise ValueError('A release toolkit SHA-256 is required')
          archive = work / filename
          with urllib.request.urlopen(url, timeout=90) as response:
              archive.write_bytes(response.read(8 * 1024 * 1024 + 1))
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected_zip:
              raise ValueError('Toolkit download digest mismatch')
          inputs = check_release(archive, os.environ['GITHUB_SHA'])
          if inputs['tag'] != tag:
              raise ValueError('Toolkit tag mismatch')
          # The member allowlist and hashes have been checked against checkout.
          with zipfile.ZipFile(archive) as package:
              package.extractall(work)
          toolkit = work / prefix
          (work / 'host-inputs.json').write_text(json.dumps(inputs, indent=2) + '\n', encoding='utf-8')
          expected = json.loads((root / 'resources/input.json').read_text(encoding='utf-8'))
          url = 'https://download.nikonimglib.com/archive8/wP5Vr003qbpC07ibhJ666rmRfF47/Z_8_0311.bin'
          received = 0
          digest = hashlib.sha256()
          with urllib.request.urlopen(url, timeout=60) as response, (work / 'Z_8_0311.bin').open('xb') as output:
              while chunk := response.read(1024 * 1024):
                  received += len(chunk)
                  if received > expected['bytes']:
                      raise ValueError('Unexpected stock response size')
                  output.write(chunk)
                  digest.update(chunk)
          if received != expected['bytes'] or digest.hexdigest() != expected['sha256']:
              raise ValueError('Official input digest mismatch')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              version = os.environ['REGRESSION_VERSION']
              reference = os.environ['REGRESSION_SHA256']
              if not re.fullmatch(r'[0-9]{2}\.[0-9]{2}', version) or not re.fullmatch(r'[0-9a-f]{64}', reference):
                  raise ValueError('A valid firmware regression version and SHA-256 are required')
              env.write('REGRESSION_VERSION=' + version + '\n')
              env.write('REGRESSION_SHA256=' + reference + '\n')
              env.write('TOOLKIT_ROOT=' + str(toolkit) + '\n')
      - name: Install pinned verifier dependency
        run: python -m pip install -r "$env:TOOLKIT_ROOT/requirements.txt"
      - name: Test matching source and prebuilt units on Windows
        run: python -B "$env:TOOLKIT_ROOT/tests/test_compiled_paths.py"
      - name: Build reported and all-feature selections without a compiler
        run: python -B "$env:TOOLKIT_ROOT/tests/validate_prebuilt_cli.py" --stock "$env:RUNNER_TEMP/nikon-smoke/Z_8_0311.bin" --report "$env:RUNNER_TEMP/nikon-smoke/report.json" --all-version "$env:REGRESSION_VERSION" --all-sha256 "$env:REGRESSION_SHA256"
      - name: Preserve only the small verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-prebuilt-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/nikon-smoke/report.json
            ${{ runner.temp }}/nikon-smoke/host-inputs.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary input and outputs
        if: always()
        run: |
          if (Test-Path "$env:RUNNER_TEMP/nikon-smoke") { Remove-Item -LiteralPath "$env:RUNNER_TEMP/nikon-smoke" -Recurse -Force }
